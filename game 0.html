            align-items: center;

            padding: 8px;
            gap: 8px;

            width: var(--board-size);

            aspect-ratio: 1;

            display: grid;

        {q:"งานปาร์ตี้ทุกคนสูบพอดกันหมด คุณรู้สึกกดดัน?", o:[{t:"เป็นตัวเองและยืนยันไม่สูบ", p:6, r:"ความมั่นใจในสิ่งที่ถูกต้องคือความเท่"}, {t:"สูบเนียนๆ เพื่อให้เข้ากลุ่มได้", p:-6, r:"คุณกำลังสูญเสียตัวตนเพื่อแลกกับสารพิษ"}]},
        {q:"รุ่นพี่บอกว่าพอดช่วยให้นอนหลับง่ายขึ้น?", o:[{t:"บอกว่านิโคตินเป็นสารกระตุ้น ทำให้นอนไม่หลับ", p:5, r:"นิโคตินขัดขวางการนอนหลับที่มีคุณภาพ"}, {t:"เชื่อและลองใช้ก่อนนอน", p:-5, r:"คุณจะตื่นมาพร้อมความล้าและติดยา"}]},
        {q:"เพื่อนท้าให้เป่าควันเป็นรูปโดนัท?", o:[{t:"ท้าเพื่อนทำกิจกรรมอื่นแทน", p:4, r:"อย่าให้คำท้าไร้สาระมาทำลายปอด"}, {t:"ลองทำเพื่อให้เพื่อนยอมรับ", p:-5, r:"ปอดของคุณไม่ได้ออกแบบมาเพื่อพ่นควัน"}]},
        {q:"เจอพอดตกอยู่ที่พื้นสนามเด็กเล่น?", o:[{t:"ไม่แตะต้องและแจ้งเจ้าหน้าที่", p:5, r:"ความปลอดภัยต้องมาก่อน"}, {t:"เก็บมาพกไว้เพราะมันสวยดี", p:-4, r:"เสี่ยงต่อความผิดกฎหมายและการติดเชื้อ"}]},
        {q:"สื่อโซเชียลโฆษณาว่าพอดช่วยลดน้ำหนัก?", o:[{t:"รู้เท่าทันว่าเป็นการโฆษณาชวนเชื่อ", p:5, r:"สุขภาพดีมาจากการคุมอาหารและออกกำลังกาย"}, {t:"สั่งซื้อมาใช้เพื่อคุมน้ำหนัก", p:-6, r:"คุณจะได้ผลข้างเคียงเป็นโรคปอดแทน"}]},
        {q:"เห็นพ่อแม่สูบบุหรี่ในบ้าน คุณกังวลเรื่องควัน?", o:[{t:"บอกพ่อแม่ด้วยความรักเรื่องความเสี่ยง", p:5, r:"การสื่อสารช่วยลดความเสี่ยงคนในครอบครัว"}, {t:"เฉยๆ เพราะคิดว่าเป็นเรื่องปกติ", p:-3, r:"ควันมือสองทำลายสุขภาพคุณทุกวัน"}]},
        {q:"เพื่อนบอกว่า 'สูบพอดแล้วไม่มีกลิ่นปาก'?", o:[{t:"ตอบว่า 'แต่มีนิโคตินและสารก่อมะเร็งนะ'", p:5, r:"กลิ่นหอมบังหน้า สารพิษซ่อนหลัง"}, {t:"เชื่อเพื่อนและคิดว่าปลอดภัย", p:-4, r:"การหลงเชื่อโฆษณาปากต่อปากเป็นอันตราย"}]},
        {q:"มีพอดรสชาติแปลกใหม่มาแจกฟรีให้ลอง?", o:[{t:"ปฏิเสธและไม่หลงกลของฟรี", p:5, r:"ของฟรีที่แลกด้วยสุขภาพคือของที่แพงที่สุด"}, {t:"ลองของฟรีเพราะไม่ต้องเสียเงิน", p:-6, r:"คุณอาจต้องจ่ายค่ารักษาแพงกว่าในอนาคต"}]},
        {q:"คุณอยากดูเท่ในสายตาคนที่ชอบ โดยการสูบพอด?", o:[{t:"ออกกำลังกายและทำบุคลิกให้ดีแทน", p:6, r:"เสน่ห์ที่แท้จริงมาจากสุขภาพที่สดใส"}, {t:"แอบสูบให้เขาเห็น", p:-5, r:"คนส่วนใหญ่ชอบคนที่ดูแลตัวเองมากกว่าคนติดยา"}]},
        {q:"เพื่อนฝากพอดไว้ในกระเป๋าคุณครู่เดียว?", o:[{t:"ปฏิเสธไม่รับฝากของผิดกฎหมาย", p:6, r:"ป้องกันตัวเองจากปัญหาทางกฎหมาย"}, {t:"ช่วยเพื่อนเพราะเห็นว่าเป็นเรื่องเล็ก", p:-5, r:"ถ้ามีการตรวจค้น คุณจะเป็นผู้รับผิดชอบ"}]},
        {q:"ครูถามว่าใครเคยเห็นการขายพอดใกล้โรงเรียน?", o:[{t:"ให้ข้อมูลอย่างลับๆ เพื่อความปลอดภัย", p:5, r:"การช่วยดูแลสังคมคือหน้าที่พลเมืองดี"}, {t:"เงียบไว้เพราะไม่อยากยุ่ง", p:-2, r:"ปล่อยให้ภัยอันตรายขยายตัวในโรงเรียน"}]},
        {q:"พี่ชายบอกว่าสูบพอดดีกว่าสูบเหล้า?", o:[{t:"บอกว่าอันตรายทั้งคู่ ไม่ควรเลือกอย่างใดอย่างหนึ่ง", p:5, r:"การเปรียบเทียบสารพิษไม่ได้ทำให้มันปลอดภัยขึ้น"}, {t:"หันไปสูบตามพี่", p:-6, r:"คุณกำลังเลียนแบบพฤติกรรมทำลายสุขภาพ"}]},
        {q:"คุณรู้สึกประหม่าในกลุ่มเพื่อนใหม่?", o:[{t:"ใช้วิธีพูดคุยและเป็นมิตรแทนการสูบพอด", p:5, r:"มิตรภาพสร้างได้ด้วยความจริงใจ"}, {t:"ใช้การสูบพอดเป็นบัตรผ่านเข้ากลุ่ม", p:-5, r:"มิตรภาพบนพื้นฐานสารเสพติดมักไม่ยั่งยืน"}]},
        {q:"คุณเจอคลิปสอนแต่งเครื่องพอดให้แรงขึ้น?", o:[{t:"กดรายงานคลิปและไม่สนใจ", p:5, r:"พอดที่แรงขึ้นเสี่ยงต่อการระเบิดและรับยาเกินขนาด"}, {t:"ลองทำตามเพื่อความแรง", p:-7, r:"เสี่ยงต่ออันตรายร้ายแรงทั้งจากไฟฟ้าและสารพิษ"}]},
        {q:"มีค่ายเยาวชนต้านยาเสพติดรับสมัครสมาชิก?", o:[{t:"สมัครเข้าร่วมเพื่อเรียนรู้และช่วยเพื่อน", p:6, r:"การเป็นแกนนำสุขภาพเป็นเรื่องน่าภูมิใจ"}, {t:"ไม่สนใจเพราะคิดว่าน่าเบื่อ", p:0, r:"คุณพลาดโอกาสพัฒนาทักษะการป้องกันตนเอง"}]}
    ];

    const DB_MISSIONS = [
        {t: "ตะโกน 'หนีควันพอด!' 3 ครั้ง", b: 2},
        {t: "ทำท่าบ๊ายบายให้บุหรี่ไฟฟ้า", b: 3},
        {t: "ยืนขาเดียวตอบข้อถัดไป", b: 3}
    ];

    // --- LOGIC ---
    let players = [], turnIdx = 0, isAction = false;
    let decks = { yn:[], kn:[], sc:[] };
    let usedCount = 0;
    const TARGET = 60;

    document.getElementById('p-count').oninput = (e) => {
        document.getElementById('count-display').innerText = `${e.target.value} คน`;
        const b = document.getElementById('names-box'); b.innerHTML = '';
        for(let i=0; i<e.target.value; i++) {
            b.innerHTML += `<input type="text" class="p-in w-full p-2.5 bg-slate-800 text-white border border-white/10 rounded-xl font-bold text-xs" value="PLAYER ${i+1}">`;
        }
    };
    document.getElementById('p-count').dispatchEvent(new Event('input'));

    function startGame() {
        players = Array.from(document.querySelectorAll('.p-in')).map((n, i) => ({
            id: i, name: n.value, pos: 0, score: 0,
            color: ['#6366f1', '#f43f5e', '#10b981', '#fbbf24', '#8b5cf6'][i]
        }));
        decks.yn = [...DB_YN].sort(() => Math.random() - 0.5);
        decks.kn = [...DB_KN].sort(() => Math.random() - 0.5);
        decks.sc = [...DB_SC].sort(() => Math.random() - 0.5);
        usedCount = 0; turnIdx = 0;
        document.getElementById('card-counter').innerText = `0/${TARGET}`;
        
        createBoard();
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        updateUI(); render(); startTurn();
    }

    function createBoard() {
        const board = document.getElementById('board'); board.innerHTML = '';
        const coords = [];
        for(let i=0; i<=10; i++) coords.push({r:1, c:i+1});
        for(let i=1; i<=10; i++) coords.push({r:i+1, c:11});
        for(let i=9; i>=0; i--) coords.push({r:11, c:i+1});
        for(let i=9; i>=1; i--) coords.push({r:i+1, c:1});

        const safeIdx = new Set();
        const rand = (min,max,c) => { 
            let r=[]; while(r.length<c){ let v=Math.floor(Math.random()*(max-min+1))+min; if(!r.includes(v)) r.push(v); } return r; 
        };
        rand(1,10,2).forEach(v => safeIdx.add(v));
        rand(11,20,4).forEach(v => safeIdx.add(v));
        rand(21,30,3).forEach(v => safeIdx.add(v));
        rand(31,39,4).forEach(v => safeIdx.add(v));

        let types = [...Array(9).fill('yn'), ...Array(9).fill('kn'), ...Array(8).fill('sc')].sort(() => Math.random()-0.5);

        coords.forEach((c, i) => {
            let t = i===0 ? 'S' : (safeIdx.has(i) ? '🍃' : (types.pop() || '🍃'));
            const d = document.createElement('div');
            d.className = `cell ${t==='S'?'cell-start':(t==='🍃'?'cell-empty':(t==='yn'?'type-yesno':(t==='kn'?'type-knowledge':'type-scenario')))}`;
            d.style.gridRow = c.r; d.style.gridColumn = c.c; d.id = `cell-${i}`;
            d.innerHTML = t==='yn'?'Y/N':t==='kn'?'KNOW':t==='sc'?'SCEN':t;
            board.appendChild(d);
        });
    }

    function rollDice() {
        if(isAction) return; isAction = true;
        const d = document.getElementById('dice');
        let v = Math.floor(Math.random()*6)+1, c=0;
        let anim = setInterval(() => {
            d.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][Math.floor(Math.random()*6)];
            if(c++ > 8) {
                clearInterval(anim); d.innerText = ['⚀','⚁','⚂','⚃','⚄','⚅'][v-1];
                players[turnIdx].pos = (players[turnIdx].pos + v) % 40;
                render(); setTimeout(() => check(players[turnIdx]), 500);
            }
        }, 60);
    }

    function check(p) {
        const c = document.getElementById(`cell-${p.pos}`);
        let t = c.classList.contains('type-yesno')?'yn':(c.classList.contains('type-knowledge')?'kn':(c.classList.contains('type-scenario')?'sc':'empty'));
        if(t !== 'empty') open(t, p); else next();
    }

    function open(type, p) {
        let card = decks[type].pop();
        if(!card) { 
            // If specific deck is out, try to pick from any available deck
            const anyDeck = Object.keys(decks).find(k => decks[k].length > 0);
            if(anyDeck) { card = decks[anyDeck].pop(); type = anyDeck; }
            else { next(); return; }
        }

        usedCount++;
        document.getElementById('card-counter').innerText = `${usedCount}/${TARGET}`;

        const m = document.getElementById('modal'), qtxt = document.getElementById('card-question'), btns = document.getElementById('card-btns');
        m.classList.remove('hidden'); btns.innerHTML = '';
        document.getElementById('type-box').classList.add('hidden');
        document.getElementById('feedback-summary').classList.add('hidden');
        document.getElementById('final-results').classList.add('hidden');
        qtxt.classList.remove('hidden');

        const badge = document.getElementById('card-badge');
        badge.innerText = type === 'yn' ? 'YES / NO' : type === 'kn' ? 'KNOWLEDGE' : 'SCENARIO';
        badge.className = `inline-block px-3 py-1 rounded-full text-[8px] font-black text-white mb-3 ${type==='yn'?'bg-sky-500':(type==='kn'?'bg-pink-500':'bg-rose-500')}`;
        qtxt.innerText = card.q;

        let mission = (Math.random() < 0.25) ? DB_MISSIONS[Math.floor(Math.random()*DB_MISSIONS.length)] : null;
        if(mission) {
            const mb = document.createElement('div'); mb.className = "mb-3 p-2 bg-amber-50 text-amber-800 border-2 border-dashed border-amber-200 rounded-xl text-[9px] font-bold";
            mb.innerText = `🕵️ ภารกิจลับ: ${mission.t}`; btns.appendChild(mb);
        }

        if(type === 'yn') {
            btns.appendChild(createBtn("ใช่ / ถูกต้อง", () => proc(card.a === true, 2, "ถูกต้อง", "ผิด", card.r, mission)));
            btns.appendChild(createBtn("ไม่ใช่ / ผิด", () => proc(card.a === false, 2, "ถูกต้อง", "ผิด", card.r, mission)));
        } else if(type === 'kn') {
            document.getElementById('type-box').classList.remove('hidden');
            document.getElementById('type-input').value = '';
            btns.appendChild(createBtn("ตรวจสอบคำตอบ", () => {
                let ok = card.k.some(k => document.getElementById('type-input').value.toLowerCase().includes(k.toLowerCase()));
                proc(ok, 3, "ถูกต้อง", "ผิด", card.r, mission);
            }));
        } else {
            card.o.forEach(o => btns.appendChild(createBtn(o.t, () => proc(true, o.p, "ผลลัพธ์", "ผลลัพธ์", o.r, mission))));
        }

        function proc(isS, pts, sM, fM, explain, mis) {
            let mod = isS ? Math.abs(pts) : -Math.abs(pts);
            let logs = [{t: isS?sM:fM, p: mod, r: explain, c: isS?'text-green-600':'text-red-600'}];
            if(mis) {
                qtxt.innerHTML = `<div class="text-xs font-black text-indigo-500 mb-1">ผลภารกิจลับ</div><div class="text-[10px] text-slate-400 italic">"${mis.t}"</div>`;
                btns.innerHTML = '';
                btns.appendChild(createBtn(`ทำสำเร็จ (+${mis.b})`, () => { logs.push({t:"ภารกิจ", p:mis.b, r:"สำเร็จ", c:"text-amber-500"}); end(logs); }));
                btns.appendChild(createBtn("ไม่สำเร็จ (0)", () => end(logs)));
            } else end(logs);
        }

        function end(logs) {
            p.score += logs.reduce((a,l) => a+l.p, 0);
            qtxt.classList.add('hidden');
            document.getElementById('type-box').classList.add('hidden');
            const fs = document.getElementById('feedback-summary'); fs.classList.remove('hidden');
            document.getElementById('feedback-list').innerHTML = logs.map(l => `
                <div class="bg-slate-50 p-2 rounded-xl border border-slate-100 flex justify-between items-center">
                    <div class="text-[9px] text-slate-600 font-bold">${l.r}</div>
                    <div class="${l.c} font-black text-xs">${l.p>=0?'+':''}${l.p}</div>
                </div>`).join('');
            btns.innerHTML = '';
            btns.appendChild(createBtn("ปิด", () => {
                m.classList.add('hidden'); updateUI();
                if(usedCount >= TARGET) showFinal(); else next();
            }));
        }
    }

    function showFinal() {
        const m = document.getElementById('modal'), qtxt = document.getElementById('card-question'), btns = document.getElementById('card-btns');
        m.classList.remove('hidden');
        document.getElementById('card-badge').className = "hidden";
        document.getElementById('feedback-summary').classList.add('hidden');
        document.getElementById('final-results').classList.remove('hidden');
        qtxt.innerText = "🏁 สิ้นสุดภารกิจ! สรุปคะแนน";
        
        let sorted = [...players].sort((a,b) => b.score - a.score);
        document.getElementById('final-rank-list').innerHTML = sorted.map((p, i) => `
            <div class="flex items-center justify-between p-3 rounded-2xl ${i===0?'bg-amber-100 border-2 border-amber-300':'bg-slate-50 border border-slate-100'}">
                <div class="flex items-center gap-3">
                    <span class="text-lg font-black ${i===0?'text-amber-600':'text-slate-400'}">#${i+1}</span>
                    <div class="w-3 h-3 rounded-full" style="background:${p.color}"></div>
                    <span class="font-bold text-slate-700">${p.name}</span>
                </div>
                <span class="font-black text-indigo-600">${p.score}</span>
            </div>`).join('');
        
        btns.innerHTML = '';
        btns.appendChild(createBtn("กลับหน้าหลัก / เล่นอีกครั้ง", () => {
            m.classList.add('hidden');
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }));
    }

    function createBtn(t, f) {
        const b = document.createElement('button');
        b.className = "w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold rounded-xl text-[10px] active:scale-95 border-b-2 border-slate-300 transition-all";
        b.innerText = t; b.onclick = f; return b;
    }

    function updateUI() {
        const s = [...players].sort((a,b) => b.score - a.score);
        document.getElementById('rankings').innerHTML = s.map((p, i) => `
            <div class="flex justify-between items-center text-[9px] py-0.5 border-b border-white/5">
                <span class="font-bold text-slate-300">#${i+1} ${p.name}</span>
                <span class="text-indigo-400 font-black">${p.score}</span>
            </div>`).join('');
    }

    function startTurn() {
        const p = players[turnIdx];
        document.getElementById('turn-label').innerText = p.name;
        document.getElementById('turn-label').style.color = p.color;
        isAction = false;
    }

    function next() { turnIdx = (turnIdx + 1) % players.length; startTurn(); }

    function render() {
        document.querySelectorAll('.player-token').forEach(e => e.remove());
        players.forEach(p => {
            const c = document.getElementById(`cell-${p.pos}`);
            const t = document.createElement('div');
            t.className = "player-token"; t.style.backgroundColor = p.color;
            let offset = players.filter(x => x.pos === p.pos && x.id < p.id).length;
            t.style.left = `${1 + (offset * 3)}px`; t.style.top = `${1 + (offset * 3)}px`;
            c.appendChild(t);
        });
    }
</script>
</body>
</html>
